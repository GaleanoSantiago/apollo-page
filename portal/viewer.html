<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Contrato - Apollo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/portal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init("TU_PUBLIC_KEY_AQUI"); // Reemplazar con Public Key real
        })();
    </script>
</head>
<body class="bg-light viewer-body">

    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent flex-shrink-0">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <img src="../img/ApolloLogo-03-white.webp" alt="" height="30"> 
                <span class="ms-2" style="font-size: 1rem;">| &nbsp; <i class="fas fa-arrow-left"></i> Volver</span>
            </a>
            <span class="navbar-text text-white fw-bold" id="contractTitle">Cargando...</span>
        </div>
    </nav>

    <div class="container-fluid viewer-content d-flex flex-column p-0">
        <div class="row h-100 m-0">
            <!-- Columna PDF (Izquierda, grande) -->
            <div class="col-md-9 p-0 bg-dark d-flex align-items-center justify-content-center">
                <div id="loadingMessage" class="text-white text-center">
                    <i class="fas fa-spinner fa-spin fa-3x"></i><br>Cargando documento...
                </div>
                <iframe id="pdfViewer" src="" frameborder="0" style="width: 100%; height: 100%;"></iframe>
            </div>

            <!-- Columna Firma (Derecha, blanca, completa) -->
            <div class="col-md-3 bg-white p-4 d-flex flex-column h-100" id="actionPanel" style="border-left: 1px solid #ddd;">
                
                <h4 class="text-dark mb-4 text-center">Firma Digital</h4>
                
                <div class="alert alert-light border text-center small mb-3 text-muted">
                    <i class="fas fa-pen-fancy mb-2"></i><br>
                    Dibuje su firma en el recuadro inferior
                </div>

                <!-- Canvas Container -->
                <div class="flex-grow-1 position-relative mb-3 d-flex flex-column">
                     <canvas id="signature-pad" class="signature-pad w-100 h-100 border"></canvas>
                </div>

                <!-- Actions -->
                <div class="d-flex justify-content-end mb-3">
                     <button class="btn btn-sm btn-outline-secondary" id="clearBtn">
                        <i class="fas fa-eraser"></i> Limpiar
                    </button>
                </div>

                <div class="d-grid gap-3">
                    <button class="btn btn-primary btn-lg py-3" id="signBtn" style="font-size: 1.2rem;">
                        FIRMAR DOCUMENTO
                    </button>
                    
                    <button class="btn btn-outline-success d-none" id="downloadBtn">
                        <i class="fas fa-download"></i> Descargar Copia
                    </button>
                </div>
                
                <div class="mt-4 text-center text-muted small">
                    Apollo Portal Seguro &copy; 2024
                </div>
            </div>
        </div>
    </div>

    <!-- Modal OTP -->
    <div class="modal fade" id="otpModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Verificación de Seguridad</h5>
                </div>
                <div class="modal-body text-center">
                    <p>Hemos enviado un código de 6 dígitos a tu correo: <br> <strong id="userEmailDisplay">...</strong></p>
                    <div class="mb-3">
                        <input type="text" id="otpInput" class="form-control form-control-lg text-center" placeholder="000000" maxlength="6" style="letter-spacing: 5px; font-weight: bold;">
                    </div>
                    <small class="text-muted">Revisa tu bandeja de entrada o spam.</small>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-success px-4" id="verifyOtpBtn">Verificar y Firmar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/viewer.js"></script>
</body>
</html>
